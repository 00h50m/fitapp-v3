  },
  'toggle-phase'(d) { const o = U.open[U.pid] || []; U.open[U.pid] = o.includes(d.id) ? o.filter(x => x !== d.id) : [...o, d.id]; save(); render(); },
  'expand-all'() { const o = U.open[U.pid] || []; U.open[U.pid] = o.length === PHASES.length ? [] : PHASES.map(p => p.id); save(); render(); },
  'goto-incs'() { U.panel = null; U.tab = 'etapas'; U.open[U.pid] = [...new Set([...(U.open[U.pid] || []), 'desenvolvimento'])]; save(); render(); const e = document.getElementById('incs'); e && e.scrollIntoView({ block: 'center' }); },
  'open-step'(d) { if (U.tab !== 'etapas') { U.tab = 'etapas'; } openPanel('step', d.id); },
  'open-gate'(d) { openPanel('gate', d.id); },
  'open-doc'(d) { openPanel('doc', d.id); },
  'open-task'(d) { openPanel('task', d.id); },
  'open-rec'(d) { openPanel('rec', d.id); },
  'new-rec'(d) { openPanel('rec', null, { newType: d.id }); },
  'open-update'(d) { openPanel('update', d.id || null); if (d.id === 'health') { const e = document.getElementById('up-l'); e && e.focus(); } },
  'open-links'() { openPanel('links'); }, 'open-connections'() { openPanel('connections'); }, 'open-phases'() { openPanel('phases'); }, 'open-reset'() { openPanel('reset'); },
  'close-panel'() { closePanel(); },
  'reset-confirm'() { S = seedState(); U = UI_DEFAULT(); try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(UI_KEY); } catch (e) { } save(); render(); toast('Dados de demonstração restaurados.'); },
  advance() { advance(cur()); },
  'gate-request'(d) {
    const p = cur(), gid = d.id, g = GATES[gid], gs = gateSummary(p, gid);
    if (!gs.all) return fail('gate', 'Critérios pendentes.');
    keepPanel();
    commit(p, () => {
      const st = p.gates[gid]; st.status = 'aguardando'; st.requestedAt = nowStamp(); st.requestedBy = actor(p); st.approvals = {};
      st.history.push({ at: nowStamp(), who: actor(p), text: 'Aprovação solicitada a ' + g.approvers.map(a => a.label).join(' e ') });
      log(p, { kind: 'gate', action: `Aprovação do Gate ${g.n} solicitada`, detail: g.approvers.map(a => a.label + ' (' + pname(approverPerson(p, a.key)) + ')').join(' · '), gate: gid });
      const s = p.steps[p.step]; if (PHASES[phaseIdx(g.phase)].steps.includes(p.step) && s.status === 'em_andamento' && g.approvers.some(a => a.key === 'CLI')) s.status = 'aguardando_terceiro';
    });
    toast(`Aprovação do Gate ${g.n} solicitada.`);
  },
  'inc-advance'(d) {
    const p = cur(), x = p.increments.find(i => i.id === d.id), nx = { planejado: 'em_desenvolvimento', em_desenvolvimento: 'em_testes', em_testes: 'concluido' }[x.status];
    commit(p, () => { x.status = nx; log(p, { kind: 'etapa', action: `${x.id} ${x.name}: ${INC_STATUS[nx].label}`, step: nx === 'em_testes' || nx === 'concluido' ? 13 : 12 }); });
  },
  'inc-add'() {
    const p = cur(), n = p.increments.length + 1;
    commit(p, () => { p.increments.push({ id: 'INC-' + n, name: 'Incremento ' + n, status: 'planejado', items: 0, bugs: 0 }); log(p, { kind: 'etapa', action: `Incremento ${n} adicionado ao ciclo de desenvolvimento`, step: 12 }); });
  },
  'sync-project'() { const p = cur(); let n; commit(p, () => { n = syncProject(p); }); toast(`Sincronizado com o Project: ${n} alteração(ões).`); },
  'sync-all'() { let n = 0; S.projects.filter(p => !p.closed).forEach(p => { const b = health(p).level; n += syncProject(p); const a = health(p); if (a.level !== b) log(p, { kind: 'saude', action: `Saúde recalculada: ${HEALTH[b]} → ${a.label}`, detail: a.reasons[0].t }); }); S.globalSync = nowStamp(); save(); render(); toast(`Sincronização simulada concluída: ${n} alteração(ões) em ${S.projects.filter(p => !p.closed).length} projetos.`); },
  'crono-view'(d) { U.crono = d.id; save(); render(); },
  'doc-filter'(d) { U.tab = 'docs'; U.docFilter = d.id; save(); render(); },
  'go-fin'() { U.view = 'fin'; U.finQ = cur().client; U.finSit = cur().closed ? 'finalizados' : 'ativos'; U.pid = null; save(); render(); },
  'fin-sit'(d) { U.finSit = d.id; save(); render(); },
};

const CHANGES = {
  role(el) { S.role = el.value; save(); keepPanel(); render(); toast('Perfil de demonstração: ' + roleName()); },
  f(el) { U.f[el.dataset.id] = el.value; save(); render(); },
  mine(el) { U.f.mine = el.checked; save(); render(); },
  'hist-kind'(el) { U.histKind = el.value; save(); render(); },
  'step-ck'(el) {
    const p = cur(), n = +el.dataset.n, i = +el.dataset.i, it = p.steps[n].checklist[i];
    keepPanel(); commit(p, () => { it.done = el.checked; log(p, { kind: 'etapa', action: `Etapa ${n} · checklist: “${it.t}” ${el.checked ? 'concluída' : 'reaberta'}`, step: n }); });
  },
  'gate-crit'(el) {
    const p = cur(), gid = el.dataset.gate, cid = el.dataset.c, c = GATES[gid].criteria.find(x => x.id === cid);
    keepPanel(); commit(p, () => {
      p.gates[gid].crit[cid] = { met: el.checked, by: actor(p), at: nowStamp() };
      p.gates[gid].history.push({ at: nowStamp(), who: actor(p), text: `Critério ${el.checked ? 'atendido' : 'reaberto'}: ${c.text}` });
      log(p, { kind: 'gate', action: `Gate ${GATES[gid].n} · critério ${el.checked ? 'atendido' : 'reaberto'}: ${c.text}`, gate: gid });
    });
  },
};

const FORMS = {
  'project-date'(fd) {
    const p = cur(), nd = fd.get('date'), reason = (fd.get('reason') || '').trim(), before = projForecastEnd(p), delta = diff(nd, before);
    if (!reason) return fail('project-date', 'Informe o motivo da mudança de data.');
    if (!delta) return fail('project-date', 'A nova data é igual à previsão atual.');
    const open = p.tasks.filter(t => t.status !== 'concluida');
    if (!open.length) return fail('project-date', 'Não há entregas em aberto para reprogramar.');
    let n; keepPanel(); U.err = null;
    commit(p, () => { open.forEach(t => { t.forecast = addDays(t.forecast, delta); t.syncPending = true; }); n = recordDateChange(p, before, fd.get('cat'), reason); });
    toast(`Mudança de data registrada (${n}ª). Desvio acumulado: ${diff(projForecastEnd(p), p.originalEnd)} dias.`, n >= 2 ? 'warn' : '');
  },
  step(fd, el) {
    const p = cur(), n = +el.dataset.id, s = p.steps[n], v = Object.fromEntries(fd);
    if (v.status === 'na' && !v.naReason.trim()) return fail('step', 'Informe a justificativa para marcar a etapa como não aplicável.');
    if (v.planEnd < v.planStart) return fail('step', 'O término planejado não pode ser anterior ao início.');
    keepPanel(); U.err = null;
    commit(p, () => {
      const ch = [];
      if (v.status !== s.status) ch.push(`situação ${STEP_STATUS[s.status].label} → ${STEP_STATUS[v.status].label}`);
      if (v.owner !== stepOwner(p, n)) ch.push('responsável ' + pname(v.owner));
      if (v.planStart !== s.planStart || v.planEnd !== s.planEnd) ch.push(`planejado ${fmtS(v.planStart)}–${fmtS(v.planEnd)}`);
      if ((v.impediment || '') !== s.impediment && v.impediment.trim()) ch.push('impedimento registrado');
      Object.assign(s, { status: v.status, owner: v.owner, planStart: v.planStart, planEnd: v.planEnd, realStart: v.realStart || null, realEnd: v.realEnd || null, impediment: v.impediment.trim(), naReason: v.naReason.trim() });
      if (v.evidence && v.evidence.trim()) { s.evidences.push({ at: nowStamp(), by: actor(p), text: v.evidence.trim() }); ch.push('evidência vinculada'); }
      log(p, { kind: v.impediment && v.impediment.trim() && ch.includes('impedimento registrado') ? 'risco' : 'etapa', action: `Etapa ${n} atualizada`, detail: ch.join(' · ') || 'Sem alterações de dados', reason: v.status === 'na' ? v.naReason : (ch.includes('impedimento registrado') ? v.impediment : ''), step: n });
    });
    toast('Etapa salva.');
  },
  'gate-decision'(fd, el) { gateDecide(cur(), el.dataset.id, fd.get('decision'), fd.get('comment') || ''); },
  'gate-evidence'(fd, el) { const p = cur(), gid = el.dataset.id; keepPanel(); commit(p, () => { p.gates[gid].evidences.push({ at: nowStamp(), by: actor(p), text: fd.get('text') }); p.gates[gid].history.push({ at: nowStamp(), who: actor(p), text: 'Evidência adicionada: ' + fd.get('text') }); log(p, { kind: 'gate', action: `Gate ${GATES[gid].n} · evidência adicionada`, detail: fd.get('text'), gate: gid }); }); },
  'doc-approve'(fd, el) {
    const p = cur(), d = p.docs.find(x => x.id === el.dataset.id), v = fd.get('version'), ev = (fd.get('evidence') || '').trim();
    if (v !== d.version) return fail('doc-approve', `A aprovação precisa se referir à versão atual (v${d.version}). A v${v} foi substituída e não vale como aprovação; peça ao aprovador que avalie a v${d.version}.`);
    if (!ev) return fail('doc-approve', 'Informe a evidência da aprovação (e-mail, ata, assinatura).');
    keepPanel(); U.err = null;
    commit(p, () => {
      d.approval = { version: v, by: fd.get('by'), at: fd.get('at') + 'T' + nowStamp().slice(11), evidence: ev, registeredBy: actor(p) };
      d.status = 'aprovado'; d.updatedAt = nowStamp(); d.evidences.push({ at: nowStamp(), by: actor(p), text: 'Aprovação v' + v + ': ' + ev });
      log(p, { kind: 'documento', action: `Aprovação registrada: ${d.name} v${v}`, detail: 'Aprovador: ' + pname(fd.get('by')) + ' · ' + ev, doc: d.id });
      Object.entries(GATES).forEach(([gid, g]) => g.criteria.filter(c => c.doc === d.id).forEach(c => { if (p.gates[gid].status !== 'aprovado' && p.gates[gid].status !== 'nao_iniciado') p.gates[gid].history.push({ at: nowStamp(), who: actor(p), text: `Critério atendido pelo documento: ${c.text} (v${v})` }); }));
    });
    toast(`${d.name} v${v} aprovado. Critério do gate atualizado; o gate continua aguardando aprovação formal.`);
  },
  'doc-version'(fd, el) {
    const p = cur(), d = p.docs.find(x => x.id === el.dataset.id), nv = bumpVersion(d.version), wasDone = docDone(d);
    keepPanel(); commit(p, () => {
      d.versions.push({ v: nv, at: nowStamp(), by: actor(p), note: fd.get('note') }); d.version = nv; d.path = docPath(p, d, nv); d.updatedAt = nowStamp();
      if (d.status === 'pendente' || d.status === 'reprovado') d.status = 'elaboracao';
      if (wasDone && d.needsApproval) d.status = 'revisao';
      const crits = Object.entries(GATES).flatMap(([gid, g]) => g.criteria.filter(c => c.doc === d.id).map(c => 'Gate ' + g.n + ': ' + c.text));
      log(p, { kind: 'documento', action: `Nova versão: ${d.name} v${nv}`, detail: fd.get('note') + (wasDone && d.needsApproval && crits.length ? ' · revalidação necessária — ' + crits.join('; ') : ''), doc: d.id });
    });
    toast(`v${nv} publicada.${wasDone && d.needsApproval ? ' Critérios vinculados precisam de revalidação.' : ''}`, wasDone && d.needsApproval ? 'warn' : '');
  },
  'doc-edit'(fd, el) {
    const p = cur(), d = p.docs.find(x => x.id === el.dataset.id), v = Object.fromEntries(fd);
    if (v.status === 'na' && !v.naReason.trim()) return fail('doc-edit', 'Documentos não aplicáveis exigem justificativa.');
    if (v.status === 'aprovado' && d.needsApproval && !(d.approval && d.approval.version === d.version)) return fail('doc-edit', `Este documento exige aprovação de ${pname(d.approver)}. Use “Registrar aprovação” com a evidência da v${d.version}.`);
    if (['aguardando_cliente', 'revisao', 'aprovado'].includes(v.status) && !d.versions.length) return fail('doc-edit', 'Publique uma versão do documento antes de enviá-lo para revisão ou aprovação.');
    keepPanel(); U.err = null;
    commit(p, () => {
      const ch = [];
      if (v.status !== d.status) ch.push(`situação ${DOC_STATUS[d.status].label} → ${DOC_STATUS[v.status].label}`);
      if ((v.due || null) !== d.due) ch.push('prazo ' + (v.due ? fmt(v.due) : 'removido'));
      if (v.owner !== d.owner) ch.push('responsável ' + pname(v.owner));
      if (v.req !== d.req) ch.push(v.req === 'obrigatorio' ? 'obrigatório' : 'opcional');
      Object.assign(d, { status: v.status, req: v.req, owner: v.owner, due: v.due || null, naReason: v.naReason.trim() });
      if (v.approver) d.approver = v.approver;
      d.updatedAt = nowStamp();
      log(p, { kind: 'documento', action: `Documento atualizado: ${d.name}`, detail: ch.join(' · ') || 'Sem alterações', reason: v.status === 'na' ? v.naReason : '', doc: d.id });
    });
    toast('Documento salvo.');
  },
  'doc-evidence'(fd, el) { const p = cur(), d = p.docs.find(x => x.id === el.dataset.id); keepPanel(); commit(p, () => { d.evidences.push({ at: nowStamp(), by: actor(p), text: fd.get('text') }); log(p, { kind: 'documento', action: `Evidência vinculada: ${d.name}`, detail: fd.get('text'), doc: d.id }); }); toast('Evidência vinculada.'); },
  'task-forecast'(fd, el) {
    const p = cur(), t = p.tasks.find(x => x.id === el.dataset.id), nd = fd.get('date'), reason = (fd.get('reason') || '').trim();
    if (!reason) return fail('task-forecast', 'Informe o motivo da mudança de previsão.');
    const delta = diff(nd, t.forecast); if (!delta) return fail('task-forecast', 'A nova previsão é igual à atual.');
    keepPanel(); U.err = null;
    const endBefore = projForecastEnd(p); let nchg = null;
    commit(p, () => {
      const old = t.forecast; t.forecast = nd; t.syncPending = true; const moved = [];
      if (fd.get('shift')) { let prev = t; p.tasks.forEach(x => { if (x.dependsOn === prev.id && x.status !== 'concluida') { x.forecast = addDays(x.forecast, delta); x.syncPending = true; moved.push(x.name); prev = x; } }); }
      log(p, { kind: 'cronograma', action: `Previsão alterada: ${t.name} ${fmtS(old)} → ${fmtS(nd)}`, detail: `Linha de base preservada (${fmt(t.baseEnd)})${moved.length ? ' · dependentes deslocados: ' + moved.length : ''}`, reason });
      nchg = recordDateChange(p, endBefore, fd.get('cat'), reason);
    });
    toast(nchg ? `Previsão atualizada. O término do projeto mudou (${nchg}ª mudança de data).` : 'Previsão atualizada. A linha de base foi preservada.', nchg >= 2 ? 'warn' : '');
  },
  'task-done'(fd, el) {
    const p = cur(), t = p.tasks.find(x => x.id === el.dataset.id);
    keepPanel(); commit(p, () => { t.status = 'concluida'; t.doneDate = fd.get('date'); t.pct = 100; t.syncPending = true; log(p, { kind: 'cronograma', action: 'Entrega concluída: ' + t.name, detail: 'Conclusão em ' + fmt(t.doneDate) + (diff(t.doneDate, t.baseEnd) > 0 ? ` (+${diff(t.doneDate, t.baseEnd)}d sobre a linha de base)` : '') }); });
    toast('Entrega concluída.');
  },
  'task-baseline'(fd, el) {
    const p = cur(), t = p.tasks.find(x => x.id === el.dataset.id), reason = (fd.get('reason') || '').trim();
    if (!reason) return fail('task-baseline', 'Informe a justificativa.');
    keepPanel(); commit(p, () => {
      const to = taskEnd(t); t.baselineHistory.push({ at: nowStamp(), by: actor(p), from: t.baseEnd, to, reason }); t.baseEnd = to;
      p.baseEnd = p.tasks.reduce((m, x) => x.baseEnd > m ? x.baseEnd : m, p.tasks[0].baseEnd);
      log(p, { kind: 'cronograma', action: `Linha de base redefinida: ${t.name}`, detail: `${fmt(t.baselineHistory.slice(-1)[0].from)} → ${fmt(to)}`, reason });
    });
    toast('Linha de base redefinida e registrada no histórico.');
  },
  rec(fd, el) {
    const p = cur(), v = Object.fromEntries(fd), id = el.dataset.id, type = el.dataset.type;
    if (!v.title.trim()) return fail('rec', 'Informe a descrição.');
    const data = { title: v.title.trim(), owner: v.owner, due: v.due || null, status: v.status, impact: v.impact, mitigation: v.mitigation.trim(), affects: v.affects, evidence: v.evidence.trim() };
    if (type === 'risco') data.prob = v.prob;
    if (type === 'impedimento') data.external = !!v.external;
    if (type === 'mudanca') Object.assign(data, { changeKind: v.changeKind, impPrazo: v.impPrazo, impEsforco: v.impEsforco, impCusto: v.impCusto, approvalNeeded: v.approvalNeeded });
    commit(p, () => {
      if (id) { const r = p.records.find(x => x.id === id), old = r.status; Object.assign(r, data); log(p, { kind: 'risco', action: `${REC_TYPES[type].one} atualizado: ${r.title}`, detail: old !== r.status ? `Situação ${old} → ${r.status}` : '' }); }
      else { const n = p.records.filter(r => r.type === type).length + 1; let nid = REC_TYPES[type].prefix + '-' + String(n).padStart(3, '0'); while (p.records.some(r => r.id === nid)) nid = nid.replace(/\d+$/, m => String(+m + 1).padStart(3, '0')); p.records.push({ id: nid, type, createdAt: nowStamp(), ...data }); log(p, { kind: 'risco', action: `${REC_TYPES[type].one} registrado: ${data.title}`, detail: 'Responsável: ' + pname(data.owner) + (data.due ? ' · prazo ' + fmt(data.due) : '') }); }
      U.panel = null;
    });
    toast(id ? 'Registro atualizado.' : 'Registro criado.');
  },
  update(fd) {
    const p = cur(), v = Object.fromEntries(fd), text = (v.text || '').trim();
    if (v.hmode === 'manual' && !(v.reason || '').trim()) return fail('update', 'A avaliação manual de saúde exige justificativa.');
    if (!text && v.hmode !== 'manual' && (!v.situation || v.situation === p.situation)) return fail('update', 'Escreva o resumo da atualização.');
    commit(p, () => {
      if (text) { p.updates.unshift({ at: nowStamp(), by: actor(p), text, next: v.next || '' }); log(p, { kind: 'atualizacao', action: 'Atualização registrada', detail: text }); }
      if (v.situation && v.situation !== p.situation) { log(p, { kind: 'etapa', action: `Situação alterada: ${SITUATION[p.situation].label} → ${SITUATION[v.situation].label}`, reason: text }); p.situation = v.situation; }
      if (v.hmode === 'manual') { p.manualHealth = { level: v.level, reason: v.reason.trim(), by: actor(p), at: nowStamp() }; log(p, { kind: 'saude', action: 'Avaliação manual de saúde: ' + HEALTH[v.level], detail: 'Cálculo automático: ' + autoHealth(p).label, reason: v.reason.trim() }); }
      else if (p.manualHealth) { p.manualHealth = null; log(p, { kind: 'saude', action: 'Avaliação manual removida: volta ao cálculo automático' }); }
      U.panel = null;
    });
    toast('Atualização registrada.');
  },
};

/* ===== Eventos ===== */
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.overlay) { closePanel(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && U.panel) { e.preventDefault(); closePanel(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act]:not(button):not(a):not(input):not(select)')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Tab' && U.panel) {
    const f = [...document.querySelectorAll('.drawer button:not([disabled]), .drawer input:not([disabled]), .drawer select:not([disabled]), .drawer textarea:not([disabled]), .drawer [tabindex="0"]')];
    if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === a || document.activeElement.id === 'panel-title')) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (!el) return; if (el.dataset.input === 'q') U.f.q = el.value; else U[el.dataset.input] = el.value; save(); render(); });
document.addEventListener('submit', e => { const el = e.target.closest('[data-form]'); if (!el) return; e.preventDefault(); const fn = FORMS[el.dataset.form]; if (fn) fn(new FormData(el), el); });

load(); render();
</script>
