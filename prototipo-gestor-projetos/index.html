<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Projetos Simbiox</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head><body>
<style>
/* Layout: suite bar + report shell (abas existentes) + conteúdo denso em tabelas; painel lateral para detalhes. */
:root{
  color-scheme:dark;
  --bg:#141518; --suite:#101a28; --surface:#1c1d21; --surface-2:#222328; --surface-3:#2a2c32; --hover:#272930;
  --line:#2f3138; --line-2:#3c3f48;
  --text:#ecedf0; --text-2:#b4b7bf; --text-3:#9195a0;
  --accent:#f0a23b; --accent-2:#ffbf6e; --accent-bg:rgba(240,162,59,.13); --accent-ink:#1b1206;
  --green:#52cb90; --green-bg:rgba(82,203,144,.13);
  --yellow:#f1c84b; --yellow-bg:rgba(241,200,75,.13);
  --red:#f5796b; --red-bg:rgba(245,121,107,.14);
  --gray:#aeb3bc; --gray-bg:rgba(174,179,188,.13);
  --blue:#7fb2fb; --blue-bg:rgba(127,178,251,.13);
  --violet:#ab9ff4;
  --focus:#ffd08a;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;left:0;top:0}
.tablewrap,.board,.tl,.stepwrap,.kpi,.card,.chip,.report{position:relative}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.sub{color:var(--text-2)}
.small{font-size:12px}
.xs{font-size:11px}
.strong{font-weight:600}
.nowrap{white-space:nowrap}
.mono{font-family:var(--mono);font-size:11.5px}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}

/* suite */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--suite)}
.suite{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--suite);border-bottom:1px solid #1d2a3d;display:flex;align-items:center;gap:14px;height:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:#fff}
.brand svg{width:22px;height:22px}
.brand .site{color:#aebbd0;font-weight:400}
.suite .sp{flex:1}
.role{display:flex;align-items:center;gap:8px;color:#aebbd0;font-size:12px}
.role select{background:#17253a;border:1px solid #2a3b55;border-radius:6px;padding:4px 8px;color:#e4ebf5}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--text);font-size:10.5px;font-weight:600;flex:none;border:1px solid var(--line-2)}
.avatar.me{background:#3a2a14;color:var(--accent-2);border-color:#5a4220}
.avatar.cli{background:#1d2c40;color:var(--blue);border-color:#2b4364}

/* shell */
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px 22px;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.report-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.report-head h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:200px}
.tabs-main{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs-main button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--text-3);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs-main button:hover{color:var(--text)}
.tabs-main button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.subtabs{display:flex;gap:6px;margin:14px 0 16px;flex-wrap:wrap}
.subtabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--text-2);cursor:pointer}
.subtabs button:hover{border-color:var(--line-2);color:var(--text)}
.subtabs button[aria-selected="true"]{background:var(--accent-bg);border-color:rgba(240,162,59,.45);color:var(--accent-2);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.btn:hover{background:var(--hover);border-color:#4a4e59}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.danger{border-color:rgba(245,121,107,.5);color:var(--red);background:transparent}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent-2);cursor:pointer;text-align:left;font-size:inherit}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--line-2) inset}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:2px 8px;font-size:11.5px;line-height:18px;white-space:nowrap;border:1px solid transparent;background:var(--surface-3);color:var(--text-2)}
.chip.green{background:var(--green-bg);color:var(--green);border-color:rgba(82,203,144,.3)}
.chip.yellow{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(241,200,75,.3)}
.chip.red{background:var(--red-bg);color:var(--red);border-color:rgba(245,121,107,.32)}
.chip.gray{background:var(--gray-bg);color:var(--gray);border-color:rgba(174,179,188,.28)}
.chip.blue{background:var(--blue-bg);color:var(--blue);border-color:rgba(127,178,251,.3)}
.chip.amber{background:var(--accent-bg);color:var(--accent-2);border-color:rgba(240,162,59,.35)}
.chip.violet{background:rgba(171,159,244,.13);color:var(--violet);border-color:rgba(171,159,244,.3)}
.chip.outline{background:transparent;border-color:var(--line-2)}
.hdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.h-green{background:var(--green)} .h-yellow{background:var(--yellow)} .h-red{background:var(--red)} .h-gray{background:var(--gray)} .h-none{background:transparent;border:1.5px solid var(--text-3)}
.h-yellow{border-radius:2px;transform:rotate(45deg) scale(.85)}
.h-red{border-radius:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--line-2);background:var(--hover)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.kpi .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:11.5px;color:var(--text-3)}
.kpi.static{cursor:default}
.c-amber{color:var(--accent-2)} .c-green{color:var(--green)} .c-yellow{color:var(--yellow)} .c-red{color:var(--red)} .c-blue{color:var(--blue)} .c-gray{color:var(--gray)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span,.lbl-s{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.input,.select,textarea.input{background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;color:var(--text);min-width:0}
.input:focus,.select:focus{border-color:var(--accent)}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search .input{width:100%;padding-left:30px}
.search svg{position:absolute;left:9px;top:8px;color:var(--text-3)}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--text-2);white-space:nowrap}
.check input{accent-color:var(--accent);width:15px;height:15px}
.toolbar .sp{flex:1}
.count{color:var(--text-3);font-size:12px}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
table.grid{width:100%;border-collapse:collapse;min-width:1080px}
table.grid th{position:sticky;top:0;background:#202126;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid tbody tr.rowlink{cursor:pointer}
table.grid tbody tr.rowlink:hover td{background:var(--hover)}
table.grid tbody tr.rowlink:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
table.grid.compact{min-width:860px}
table.grid.compact td{padding:8px 10px}
table.grid.compact th{padding:8px 10px}
.cl{display:flex;gap:10px;align-items:flex-start;min-width:0}
.cl .sq{width:26px;height:26px;border-radius:6px;background:#c98a2c;color:#1b1206;font-weight:700;display:grid;place-items:center;flex:none;font-size:12px}
.cl b{display:block;font-weight:600}
.two{display:flex;flex-direction:column;gap:2px;min-width:0}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:3px}
.bar.amber>i{background:var(--accent)} .bar.red>i{background:var(--red)} .bar.yellow>i{background:var(--yellow)} .bar.blue>i{background:var(--blue)}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.reason{color:var(--text-3);font-size:11.5px;max-width:220px}

/* board */
.phase-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:0;font-size:12px;display:flex;justify-content:space-between;align-items:center;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.col .gate-note{font-size:11px;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{border-color:var(--line-2);background:var(--hover)}
.card .t{font-weight:600}
.card .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* project page */
.crumbs{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px;flex-wrap:wrap;margin-bottom:10px}
.crumbs button{background:none;border:0;color:var(--text-2);cursor:pointer;padding:0}
.crumbs button:hover{color:var(--accent-2);text-decoration:underline}
.phead{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:16px}
.phead-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.phead h2{margin:0;font-size:19px;letter-spacing:-.01em}
.phead .client{color:var(--text-2);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin-top:14px}
.meta dt{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.meta dd{margin:2px 0 0;font-weight:500}
.health-line{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.health-line ul{margin:0;padding-left:16px;color:var(--text-2)}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--text-3);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.ptabs button:hover{color:var(--text)}
.ptabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.badge{background:var(--red);color:#2a0d08;border-radius:999px;font-size:10.5px;padding:0 6px;font-weight:700;line-height:16px}
.badge.amber{background:var(--accent);color:var(--accent-ink)}

/* panels/cards */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between}
.box .big{font-size:16px;font-weight:600}
.box.alert{border-color:rgba(245,121,107,.4)}
.box.warn{border-color:rgba(241,200,75,.35)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:2px}
.list .grow{flex:1;min-width:0}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:3px;margin-top:2px}
.stepper span{flex:1;height:6px;border-radius:2px;background:var(--surface-3)}
.stepper span.done{background:#7a5a2c}
.stepper span.cur{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--line-2)}
button.stat[aria-pressed="true"]{border-color:var(--accent)}
.stat .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}

/* phases accordion */
.phase{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:8px;overflow:hidden}
.phase-h{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:none;border:0;cursor:pointer;text-align:left;flex-wrap:wrap}
.phase-h:hover{background:var(--hover)}
.phase-h .nm{font-weight:600;font-size:13.5px;min-width:140px}
.phase-h .chev{transition:transform .15s}
.phase-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.phase.cur{border-color:rgba(240,162,59,.5)}
.phase-b{border-top:1px solid var(--line);padding:6px 14px 12px}
.steprow{display:grid;grid-template-columns:34px minmax(180px,1.6fr) 130px 130px 150px 150px 90px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.steprow:hover{background:var(--hover)}
.steprow .n{font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
.stepwrap{overflow-x:auto}
.stepwrap .inner{min-width:880px}
.gaterow{display:flex;gap:12px;align-items:center;padding:10px;margin-top:8px;border:1px dashed var(--line-2);border-radius:8px;cursor:pointer;flex-wrap:wrap;background:var(--surface);width:100%;text-align:left}
.gaterow:hover{border-color:var(--accent)}
.gate-ico{width:26px;height:26px;display:grid;place-items:center;transform:rotate(45deg);border:1.5px solid var(--accent);border-radius:4px;color:var(--accent-2);flex:none}
.gate-ico span{transform:rotate(-45deg);font-size:10.5px;font-weight:700}
.gate-ico.ok{border-color:var(--green);color:var(--green)}
.gate-ico.wait{border-color:var(--blue);color:var(--blue)}
.gate-ico.back{border-color:var(--red);color:var(--red)}
.gate-ico.off{border-color:var(--line-2);color:var(--text-3)}

/* timeline */
.tl{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px 12px;overflow-x:auto}
.tl-inner{min-width:760px;position:relative}
.tl-row{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;height:34px;border-bottom:1px solid var(--line);cursor:pointer}
.tl-row:hover{background:var(--hover)}
.tl-track{position:relative;height:100%}
.tl-base{position:absolute;top:21px;height:4px;background:var(--line-2);border-radius:2px}
.tl-bar{position:absolute;top:8px;height:11px;border-radius:3px;background:var(--blue)}
.tl-bar.done{background:var(--green)}
.tl-bar.late{background:var(--red)}
.tl-mile{position:absolute;top:6px;width:13px;height:13px;transform:translateX(-6px) rotate(45deg);background:var(--accent);border-radius:2px}
.tl-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--accent)}
.tl-axis{display:grid;grid-template-columns:220px 1fr;gap:10px;font-size:11px;color:var(--text-3);height:22px}
.tl-axis .ticks{position:relative}
.tl-axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);margin-top:8px}
.legend i{display:inline-block;width:14px;height:6px;border-radius:2px;margin-right:5px;vertical-align:1px}

/* flow (processo) */
.flow{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:4px 2px 10px}
.flow .ph{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:118px;flex:none}
.flow .ph b{display:block;font-size:12.5px}
.flow .ph span{font-size:11px;color:var(--text-3)}
.flow .gt{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--accent-2)}
.flow .ar{color:var(--text-3);flex:none}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.6);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);border-left:1px solid var(--line-2);width:min(560px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(820px,100%)}
.drawer-h{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-size:16px;flex:1}
.drawer-h .eyebrow{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.drawer-b{padding:16px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.sec{display:flex;flex-direction:column;gap:8px}

/* ===== Construção de um projeto a partir de parâmetros ===== */
function relSchedule(span) {
  const main = span - 33; let tot = 0; for (let n = 1; n <= 16; n++) tot += STEPS[n].w;
  const rel = {}; let acc = 0;
  for (let n = 1; n <= 16; n++) { const s = Math.round(acc / tot * main); acc += STEPS[n].w; rel[n] = [s, Math.max(s, Math.round(acc / tot * main) - 1)]; }
  const gl = rel[15][1]; rel[17] = [gl, gl + 30]; rel[18] = [gl + 31, gl + 33];
  return rel;
}

function buildProject(c) {
  const rel = relSchedule(c.span);
  const closed = !!c.closed;
  const step = closed ? 18 : c.step;
  let start = c.start;
  if (!start) {
    if (c.late != null) start = addDays(REF, -(c.late + rel[step][1]));
    else start = addDays(REF, -(rel[step][0] + Math.round((c.at ?? 0.5) * (rel[step][1] - rel[step][0]))));
  }
  const pl = n => ({ s: addDays(start, rel[n][0]), e: addDays(start, rel[n][1]) });
  const curPI = PHASES.findIndex(ph => ph.id === STEPS[step].phase);
  const p = {
    id: c.id, client: c.client, name: c.name, objective: c.objective, desc: c.desc,
    gp: c.gp, analyst: c.analyst, tl: c.tl || null, dev: c.dev || null, com: c.com || 'lucio', clientApprover: c.cli,
    complexity: c.complexity, score: c.score, situation: closed ? 'encerrado' : (c.situation || 'ativo'), closed,
    step, start, baseEnd: addDays(start, rel[18][1]), goLive: (step >= 16 || (step === 15 && closed)) ? pl(15).e : null,
    lastSync: c.lastSync || REF + 'T07:40', pendingSync: c.pendingSync || [],
    fin: c.fin, devops: c.devops || { backlog: 0, done: 0, bugs: 0 },
    links: { planner: 'PLN-' + c.id.slice(2), devops: 'Simbiox-Entregas\\' + c.client.split(' ')[0] + '\\' + c.id, sharepoint: 'Projetos/' + c.client + '/' + c.id, repo: c.repo || null },
    originalEnd: null, dateChanges: [],
    manualHealth: null, updates: c.updates || [], history: [], records: [], increments: [],
    steps: {}, gates: {}, docs: [], tasks: [], seq: 100,
  };
  // etapas
  for (let n = 1; n <= 18; n++) {
    const t = STEPS[n], d = pl(n), done = closed || n < step, cur = !closed && n === step;
    const ck = t.checklist.map((x, i) => ({ t: x, done: done || (cur && i < Math.ceil(t.checklist.length / 2)) }));
    p.steps[n] = { status: done ? 'concluida' : cur ? 'em_andamento' : 'nao_iniciada', owner: null, planStart: d.s, planEnd: d.e, realStart: done || cur ? d.s : null, realEnd: done ? d.e : null, checklist: ck, impediment: '', naReason: '', evidences: [] };
  }
  // gates
  Object.keys(GATES).forEach(gid => {
    const g = GATES[gid], gpi = PHASES.findIndex(ph => ph.id === g.phase);
    const st = { status: 'nao_iniciado', crit: {}, approvals: {}, requestedAt: null, requestedBy: null, evidences: [], history: [] };
    const lastStep = PHASES[gpi].steps.slice(-1)[0], when = pl(lastStep).e + 'T16:00';
    if (closed || gpi < curPI) {
      st.status = 'aprovado';
      g.criteria.forEach(cr => { if (!cr.doc && !cr.derive) st.crit[cr.id] = { met: true, by: c.gp, at: addDays(when, -2) + 'T10:00' }; });
      st.requestedAt = addDays(when, -1) + 'T09:00'; st.requestedBy = c.gp;
      g.approvers.forEach(a => { st.approvals[a.key] = { decision: 'aprovado', by: a.key === 'GP' ? c.gp : a.key === 'LID' ? 'marcos' : c.cli, at: when, comment: '' }; });
      st.history.push({ at: st.requestedAt, who: c.gp, text: 'Aprovação solicitada' }, { at: when, who: g.approvers.length > 1 ? 'Aprovadores' : (g.approvers[0].key === 'LID' ? 'marcos' : c.gp), text: 'Gate aprovado' });
    } else if (gpi === curPI) {
      st.status = 'em_preparacao';
      g.criteria.forEach(cr => { if (!cr.doc && !cr.derive) { const unmet = (c.gateUnmet || []).includes(cr.id); st.crit[cr.id] = { met: !unmet, by: unmet ? null : c.gp, at: unmet ? null : addDays(REF, -3) + 'T11:20' }; } });
    }
    p.gates[gid] = st;
  });
  // documentos
  const phaseEnd = pid => { const ph = PHASES.find(x => x.id === pid); return pl(ph.steps.slice(-1)[0]).e; };
  const approverOf = a => ({ cliente: c.cli, gp: c.gp, tl: c.tl || c.analyst, lid: 'marcos' })[a] || null;
  DOC_TPL.forEach(t => {
    const dpi = PHASES.findIndex(ph => ph.id === t.phase);
    let due = t.phase === 'garantia' ? addDays(pl(17).e, -2) : phaseEnd(t.phase);
    if (!closed && curPI < 4 && dpi > 4) due = null; // prazos definidos no planejamento
    const na = (t.na || []).includes(c.complexity);
    const d = {
      id: t.id, name: t.name, phase: t.phase, req: (t.optionalFor || []).includes(c.complexity) ? 'opcional' : 'obrigatorio',
      depth: DEPTH[c.complexity], owner: approverOf(t.owner) || ({ com: c.com || 'lucio', analyst: c.analyst })[t.owner] || c.gp,
      due, status: 'pendente', version: '—', versions: [], path: null,
      needsApproval: !!t.approver, approverRole: t.approver, approver: approverOf(t.approver), apprNote: t.apprNote || 'Aprovação',
      approval: null, evidences: [], naReason: '', updatedAt: null, continuous: !!t.continuous,
    };
    if (t.owner === 'tl') d.owner = c.tl || c.analyst;
    const mkPath = v => 'SharePoint › ' + p.links.sharepoint.replace(/\//g, ' › ') + ' › ' + String(dpi).padStart(2, '0') + '-' + PHASES[dpi].name + ' › ' + t.file + '_v' + v + '.docx';
    if (na) { d.status = 'na'; d.naReason = t.naReason; }
    else if (closed || dpi < curPI) {
      const at = (due || start) + 'T15:00';
      d.status = 'aprovado'; d.version = '1.0'; d.versions = [{ v: '1.0', at, by: d.owner, note: 'Versão final' }]; d.path = mkPath('1.0'); d.updatedAt = at;
      if (d.needsApproval) { d.approval = { version: '1.0', by: d.approver, at, evidence: d.approverRole === 'cliente' ? 'E-mail de aprovação arquivado em Aprovações' : 'Aprovação registrada no gestor', registeredBy: c.gp }; }
    } else if (dpi === curPI) {
      d.status = 'elaboracao'; d.version = '0.1'; d.versions = [{ v: '0.1', at: addDays(REF, -6) + 'T10:00', by: d.owner, note: 'Rascunho inicial' }]; d.path = mkPath('0.1'); d.updatedAt = addDays(REF, -6) + 'T10:00';
    }
    if (c.docs && c.docs[t.id]) {
      const o = c.docs[t.id]; Object.assign(d, o);
      if (o.versions && o.versions.length && !o.path) d.path = mkPath(d.version);
      if (o.status === 'aprovado' && !o.versions) { d.version = '1.0'; d.versions = [{ v: '1.0', at: (o.updatedAt || addDays(REF, -8) + 'T10:00'), by: d.owner, note: 'Versão final' }]; d.path = mkPath('1.0'); d.updatedAt = d.versions[0].at; if (d.needsApproval && !o.approval) d.approval = { version: '1.0', by: d.approver, at: d.updatedAt, evidence: 'Aprovação registrada no gestor', registeredBy: c.gp }; }
      if (o.versions && o.versions.length) d.updatedAt = o.versions.slice(-1)[0].at;
    }
    p.docs.push(d);
  });
  p.pathTpl = { base: 'SharePoint › ' + p.links.sharepoint.replace(/\//g, ' › ') };
  // cronograma (Project)
  let prev = null;
  TASK_TPL.forEach(t => {
    const d = pl(t.step);
    let base = t.frac ? addDays(d.s, Math.round(t.frac * diff(d.e, d.s))) : d.e;
    const ps = t.key === 'inc2' ? addDays(prev.baseEnd, 1) : d.s;
    const done = closed || t.step < step;
    const task = { id: 'PLN-' + c.id.slice(2) + '-' + String(TASK_TPL.indexOf(t) + 1).padStart(2, '0'), key: t.key, name: t.name, phase: STEPS[t.step].phase, step: t.step, gate: t.gate || null, contractual: !!t.contractual,
      owner: t.step === 12 ? (c.tl || c.analyst) : t.step === 16 ? c.analyst : c.gp,
      planStart: ps, planEnd: base, baseStart: ps, baseEnd: base, forecast: done ? base : addDays(base, c.slip || 0), doneDate: done ? base : null,
      dependsOn: prev ? prev.id : null, status: done ? 'concluida' : (t.step === step ? 'em_andamento' : 'nao_iniciada'), baselineHistory: [], syncPending: false };
    if (task.contractual) task.contractDate = addDays(base, 15);
    if (c.tasks && c.tasks[t.key]) Object.assign(task, c.tasks[t.key]);
    p.tasks.push(task); prev = task;
  });
  // % concluído vindo do Project (proporção do prazo decorrido para entregas em andamento)
  p.tasks.forEach(t => { if (t.pct == null) t.pct = t.status === 'concluida' ? 100 : t.status === 'em_andamento' ? Math.max(5, Math.min(90, Math.round(diff(REF, t.planStart) / Math.max(1, diff(t.forecast, t.planStart)) * 100))) : 0; });
  // mudanças de data do término: a data original nunca é alterada
  p.originalEnd = p.baseEnd;
  let curEnd = p.baseEnd;
  (c.dateChanges || []).forEach(ch => { const to = addDays(curEnd, ch.delta); p.dateChanges.push({ at: ch.at, by: ch.by, from: curEnd, to, reason: ch.reason, cat: ch.cat }); curEnd = to; });
  // incrementos
  p.increments = (c.increments || (step > 13 || closed ? [
    { name: 'Incremento 1', status: 'concluido' }, { name: 'Incremento 2', status: 'concluido' }] : [])).map((x, i) => ({ id: 'INC-' + (i + 1), items: 0, bugs: 0, ...x }));
  // registros
  (c.records || []).forEach((r, i) => p.records.push({ id: REC_TYPES[r.type].prefix + '-' + String(i + 1).padStart(3, '0'), createdAt: addDays(REF, -10) + 'T10:00', evidence: '', affects: '', ...r }));
  // histórico inicial
  const H = (at, who, kind, action, detail, reason) => p.history.push({ id: 'H' + (p.history.length + 1), at, who, kind, action, detail: detail || '', reason: reason || '' });
  H(start + 'T09:00', c.com || 'lucio', 'etapa', 'Projeto criado a partir da venda', 'Etapa 1 · Venda concluída');
  Object.keys(GATES).forEach(gid => {
    const st = p.gates[gid]; if (st.status !== 'aprovado') return;
    const g = GATES[gid]; const gpi = PHASES.findIndex(ph => ph.id === g.phase);
    H(st.approvals[g.approvers[0].key].at, g.approvers.length > 1 ? c.gp : 'marcos', 'gate', 'Gate ' + g.n + ' aprovado', g.name);
    if (PHASES[gpi + 1]) H(addDays(st.approvals[g.approvers[0].key].at, 1) + 'T09:00', c.gp, 'etapa', 'Mudança de fase: ' + PHASES[gpi].name + ' → ' + PHASES[gpi + 1].name, '');
  });
  (c.history || []).forEach(h => H(h.at, h.who, h.kind, h.action, h.detail, h.reason));
  if (c.after) c.after(p);
  p.history.sort((a, b) => b.at.localeCompare(a.at));
  return p;
}

const pct = (a, b) => b ? Math.round(a / b * 100) : 100;

}
const gateRequired = gid => GATES[gid].approvers.map(a => a.key);

/* Cronograma */
const taskEnd = t => t.doneDate || t.forecast;

/* Saúde */
const HEALTH = { green: 'Verde', yellow: 'Amarelo', red: 'Vermelho', gray: 'Cinza', none: 'Encerrado' };

  p.records.filter(r => r.type === 'risco' && recOpen(r) && r.impact === 'alto' && r.prob === 'alto').forEach(r => add('yellow', 'Risco alto aberto: ' + r.title));

    else if (late > 0) add('yellow', `Gate ${GATES[g].n} atrasado ${late} dia${late > 1 ? 's' : ''} (previsto ${fmt(due)})`);

/* Pendências priorizadas: o que impede o avanço e quem precisa agir */
function pendencies(p) {

function filtered() {
  const f = U.f, q = f.q.trim().toLowerCase();
  return S.projects.filter(p => {
    if (q && !(p.client + ' ' + p.name + ' ' + p.id).toLowerCase().includes(q)) return false;
    if (f.owner && p.gp !== f.owner) return false;
    if (f.phase && curPhase(p).id !== f.phase) return false;
    if (f.health && health(p).level !== f.health) return false;
    if (f.sit && p.situation !== f.sit) return false;
    if (f.mine && !myPend(p).length) return false;
    if (f.kpi && !kpiFlags(p)[f.kpi]) return false;

}

      ${h.manual ? `<div class="xs muted">Cálculo automático: ${h.auto.label} · registrado por ${esc(pname(h.manual.by))} em ${fmtDT(h.manual.at)}</div>` : ''}
    </section>

    <section class="box span2 ${block && block.sev >= 3 ? 'alert' : ''}"><h3>O que impede o avanço</h3>
      ${p.closed ? '<div class="muted">Projeto encerrado.</div>' : `
      <div class="big">${chk.ok ? 'Nada bloqueia o avanço da etapa atual' : esc(chk.reason)}</div>
      ${block ? `<div class="sub">Principal pendência: <button class="link" ${tgt(block)}>${esc(block.text)}</button> — ${esc(pname(block.owner))}${block.due ? ', prazo ' + fmt(block.due) : ''}</div>` : ''}
      <div class="small"><span class="muted">Impacto esperado:</span> ${impact.map(esc).join(' ')}</div>
      ${!chk.ok && chk.action ? `<div><button class="btn sm" data-act="${chk.action.act}" data-id="${chk.action.id || ''}">${esc(chk.action.label)}</button></div>` : ''}`}
    </section>
    <section class="box"><h3>Próximo gate</h3>
      ${g ? `<button class="gaterow" style="margin:0" data-act="open-gate" data-id="${g}">${gateIco(p, g)}<span class="two" style="flex:1"><b>Gate ${GATES[g].n} — ${GATES[g].name}</b><span class="small sub">Critérios ${gs.met}/${gs.total} · previsto ${fmt(gateDue(p, g))}</span></span>${statusChip(GATE_STATUS, p.gates[g].status)}</button>
      <div class="small sub">Aprovação: ${GATES[g].approvers.map(a => esc(a.label)).join(' + ')}${p.gates[g].status === 'aguardando' ? ' · pendente: ' + gatePendingApprovers(p, g).map(a => esc(pname(approverPerson(p, a.key)))).join(', ') : ''}</div>
      ${gs.blockers.length ? `<div class="small c-red">${gs.blockers.length} critério(s) bloqueando: ${gs.blockers.slice(0, 2).map(b => esc(b.text)).join('; ')}${gs.blockers.length > 2 ? '…' : ''}</div>` : `<div class="small c-green">Critérios atendidos. ${p.gates[g].status === 'aguardando' ? 'Aguardando decisão.' : 'Falta a aprovação formal.'}</div>`}` : '<div class="muted">Todos os gates aprovados.</div>'}
    </section>

    <section class="box span2"><h3>Quem precisa agir <span class="muted xs">${pend.length} pendência(s)</span></h3>
      ${pend.length ? `<ul class="list">${pend.slice(0, 6).map(x => `<li>${av(x.owner)}<div class="grow"><button class="link" ${tgt(x)}>${esc(x.text)}</button><div class="xs muted">${esc(pname(x.owner))}${isClient(x.owner) ? ' (cliente)' : ''} · ${esc(x.kind)}</div></div><span class="small nowrap">${dueTxt(x.due)}</span></li>`).join('')}</ul>` : '<div class="muted">Nenhuma pendência aberta.</div>'}
    </section>
    <section class="box"><h3>Progresso</h3>
      ${[['Entregas de valor (Project)', tDone, p.tasks.length, 'crono'], ['Documentação até a fase', ds.curDone, ds.curTotal, 'docs'], ['Gates aprovados', gApproved, 6, 'etapas']].map(([l, a, b, t]) => `<div class="prog"><div class="top"><button class="link small" data-act="ptab" data-id="${t}">${l}</button><span class="val">${a}/${b}</span></div>${bar(pct(a, b), t === 'docs' ? (pct(a, b) < 100 ? 'yellow' : '') : 'amber')}</div>`).join('')}
      <span class="xs muted">Medidos separadamente: a quantidade de etapas concluídas não representa o progresso real.</span>
    </section>

    <section class="box"><h3>Documentação <button class="link xs" data-act="ptab" data-id="docs">Abrir matriz</button></h3>
      <dl class="kv small"><dt>Até a fase atual</dt><dd class="num">${ds.curDone}/${ds.curTotal} (${pct(ds.curDone, ds.curTotal)}%)</dd><dt>Total do projeto</dt><dd class="num">${ds.allDone}/${ds.allTotal} (${pct(ds.allDone, ds.allTotal)}%)</dd>
      <dt>Vencidos</dt><dd>${ds.overdue.length ? `<button class="link c-red" data-act="doc-filter" data-id="vencidos">${ds.overdue.length}: ${ds.overdue.map(d => esc(d.name)).join(', ')}</button>` : '0'}</dd>
      <dt>Aguardando aprovação</dt><dd>${ds.awaiting.length ? `<button class="link" data-act="doc-filter" data-id="aguardando">${ds.awaiting.length}: ${ds.awaiting.map(d => esc(d.name) + ' v' + d.version).join(', ')}</button>` : '0'}</dd>
      ${ds.na.length ? `<dt>Não aplicáveis</dt><dd>${ds.na.length} (fora do cálculo)</dd>` : ''}</dl>
    </section>
    <section class="box"><h3>Financeiro <button class="link xs" data-act="go-fin">Ver no Financeiro</button></h3>
      <dl class="kv small"><dt>Valor de venda</dt><dd class="num c-green">${money(f.venda)}</dd><dt>Orçado</dt><dd class="num">${money(f.orcado)}</dd><dt>Realizado</dt><dd class="num">${money(f.realizado)}</dd>
      <dt>Rentabilidade</dt><dd class="num ${rent < .5 ? 'c-yellow' : 'c-green'}">${(rent * 100).toFixed(1).replace('.', ',')}%</dd><dt>Horas</dt><dd class="num ${f.hReal > f.hPrev ? 'c-red' : ''}">${f.hReal}h de ${f.hPrev}h</dd>
      ${f.parcela ? `<dt>Parcela pendente</dt><dd class="num c-red">${money(f.parcela)}</dd>` : ''}</dl>
    </section>
    <section class="box"><h3>Atualizações recentes <button class="link xs" data-act="open-update">Registrar</button></h3>
      ${p.updates.length ? `<ul class="list small">${p.updates.slice(0, 3).map(u => `<li><div class="grow"><div>${esc(u.text)}</div>${u.next && u.next !== '—' ? `<div class="muted">Próximo passo: ${esc(u.next)}</div>` : ''}<div class="xs muted">${esc(pname(u.by))} · ${fmtDT(u.at)}</div></div></li>`).join('')}</ul>` : '<div class="muted">Sem atualizações.</div>'}
    </section>
  </div>`;
}

/* Etapas e gates */
function phaseStatus(p, i) { const c = curPI(p); if (p.closed || i < c) return ['concluida', 'Concluída']; if (i === c) return ['em_andamento', 'Em andamento']; return ['nao_iniciada', 'Não iniciada']; }
function tabEtapas(p) {
  if (U.open[p.id] === undefined) U.open[p.id] = [curPhase(p).id];
  const open = U.open[p.id];
  return `<div class="toolbar" style="margin-top:0"><span class="sub small">Clique em uma fase para ver as etapas. Cada etapa e cada gate abrem o detalhe completo.</span><span class="sp"></span>
    <button class="btn ghost sm" data-act="expand-all">${open.length === PHASES.length ? 'Recolher todas' : 'Expandir todas'}</button></div>
  ${PHASES.map((ph, i) => {
    const [sk, sl] = phaseStatus(p, i), isOpen = open.includes(ph.id);
    return `<section class="phase ${i === curPI(p) && !p.closed ? 'cur' : ''}">
      <button class="phase-h" aria-expanded="${isOpen}" data-act="toggle-phase" data-id="${ph.id}" aria-controls="ph-${ph.id}">
        ${ic('chev', 'chev')}<span class="nm">${ph.name}</span><span class="muted small">Etapas ${ph.steps[0]}${ph.steps.length > 1 ? '–' + ph.steps.slice(-1)[0] : ''}</span>
        ${chip(STEP_STATUS[sk].cls, sl)}
        <span style="margin-left:auto" class="small">${ph.gate ? `Gate ${GATES[ph.gate].n} · ${statusChip(GATE_STATUS, p.gates[ph.gate].status)}` : `<span class="muted">${ph.note}</span>`}</span>
      </button>
      ${isOpen ? `<div class="phase-b" id="ph-${ph.id}"><div class="stepwrap"><div class="inner">
        <div class="steprow" style="cursor:default;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em"><span>#</span><span>Etapa</span><span>Situação</span><span>Responsável</span><span>Planejado</span><span>Real</span><span>Checklist</span></div>
        ${ph.steps.map(n => { const s = p.steps[n], done = s.checklist.filter(x => x.done).length; return `<div class="steprow" role="button" tabindex="0" data-act="open-step" data-id="${n}" aria-label="Abrir etapa ${n}: ${esc(STEPS[n].name)}">
          <span class="n">${n}</span><span><b>${esc(STEPS[n].name)}</b>${s.impediment ? `<div class="xs c-red">${ic('alert', 's')} ${esc(s.impediment)}</div>` : ''}${s.status === 'na' ? `<div class="xs muted">${esc(s.naReason)}</div>` : ''}</span>
          <span>${statusChip(STEP_STATUS, s.status)}</span><span class="small">${esc(pname(stepOwner(p, n)))}</span>
          <span class="small num">${fmtS(s.planStart)} – ${fmtS(s.planEnd)}</span><span class="small num">${s.realStart ? fmtS(s.realStart) + ' – ' + (s.realEnd ? fmtS(s.realEnd) : '…') : '<span class="muted">—</span>'}</span>
          <span class="small num">${done}/${s.checklist.length}</span></div>`; }).join('')}
      </div></div>
      ${ph.id === 'desenvolvimento' ? renderIncs(p) : ''}
      ${ph.gate ? (() => { const gs = gateSummary(p, ph.gate); return `<button class="gaterow" data-act="open-gate" data-id="${ph.gate}">${gateIco(p, ph.gate)}<span class="two" style="flex:1;min-width:200px"><b>Gate ${GATES[ph.gate].n} — ${GATES[ph.gate].name}</b><span class="small sub">Critérios atendidos ${gs.met}/${gs.total} · Aprovação: ${GATES[ph.gate].approvers.map(a => esc(a.label)).join(' + ')}</span></span>${statusChip(GATE_STATUS, p.gates[ph.gate].status)}<span class="small muted">${ic('chev', 's')}</span></button>`; })() : `<div class="small muted" style="margin-top:8px">${ph.note}.</div>`}
      </div>` : ''}
    </section>`;
  }).join('')}`;
}
function renderIncs(p) {
  const can = S.role !== 'CLI' && !p.closed;
  return `<div class="sec" id="incs" style="margin-top:12px"><h3>Incrementos (ciclo desenvolvimento → testes) ${can && curPhase(p).id === 'desenvolvimento' ? `<button class="btn sm" data-act="inc-add">${ic('plus', 's')} Adicionar incremento</button>` : ''}</h3>
    ${p.increments.length ? `<div class="tablewrap"><table class="grid compact" style="min-width:620px"><thead><tr><th>ID</th><th>Incremento</th><th>Situação</th><th>Itens DevOps</th><th>Bugs</th><th></th></tr></thead><tbody>
    ${p.increments.map(x => { const nx = { planejado: 'em_desenvolvimento', em_desenvolvimento: 'em_testes', em_testes: 'concluido' }[x.status]; return `<tr><td class="mono">${x.id}</td><td>${esc(x.name)}</td><td>${statusChip(INC_STATUS, x.status)}</td><td class="num">${x.items || '—'}</td><td class="num">${x.bugs || 0}</td>
      <td>${nx && can ? `<button class="btn sm" data-act="inc-advance" data-id="${x.id}">Mover para ${INC_STATUS[nx].label.toLowerCase()}</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="muted small">Os incrementos são definidos no planejamento (Gate 3).</div>'}
    <span class="xs muted">Cada incremento passa por desenvolvimento e testes sem reiniciar o projeto. A etapa 13 só termina com todos os incrementos concluídos.</span></div>`;
}

/* Cronograma */
function tabCrono(p) {
  const pend = p.pendingSync.length, outgoing = p.tasks.filter(t => t.syncPending).length;
  return `<div class="box" style="flex-direction:row;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:12px">
      <div class="two"><span class="lbl-s">Plano vinculado (Project)</span><span class="strong">${p.links.planner} · ${esc(p.client)} — ${esc(p.name)}</span></div>
      <div class="two"><span class="lbl-s">Última sincronização</span><span class="num ${syncAge(p) > 3 ? 'c-yellow' : ''}">${fmtDT(p.lastSync)}${syncAge(p) > 3 ? ' · há ' + syncAge(p) + ' dias' : ''}</span></div>
      <div class="two"><span class="lbl-s">Alterações</span><span class="small">${pend} a receber · ${outgoing} a enviar</span></div>
      <span style="flex:1"></span>
      <button class="btn" data-act="sync-project" ${p.closed ? 'disabled' : ''}>${ic('sync', 's')} Sincronizar</button>
    </div>
    ${renderDateBlock(p)}
    <div class="toolbar"><div class="seg" role="group" aria-label="Visualização do cronograma"><button data-act="crono-view" data-id="tabela" aria-pressed="${U.crono === 'tabela'}">Tabela</button><button data-act="crono-view" data-id="linha" aria-pressed="${U.crono === 'linha'}">Linha do tempo</button></div>
      <span class="small muted">Somente entregas de valor para o cliente. O backlog técnico (${p.devops.backlog} itens) fica no Azure DevOps.</span></div>
    ${U.crono === 'linha' ? renderTimeline(p) : `<div class="tablewrap"><table class="grid"><thead><tr><th>Entrega</th><th>Fase</th><th>Responsável</th><th>Planejado</th><th>Linha de base</th><th>Previsão atual</th><th>% concl. <span class="src">Project</span></th><th>Conclusão</th><th>Atraso</th><th>Dependência</th><th>Situação</th></tr></thead><tbody>
    ${p.tasks.map(t => { const dl = taskDelay(t), dep = p.tasks.find(x => x.id === t.dependsOn); return `<tr class="rowlink" tabindex="0" data-act="open-task" data-id="${t.id}">
      <td><div class="two"><b>${esc(t.name)}</b><span class="mono muted xs">${t.id}${t.contractual ? ' · marco contratual' : ''}${t.gate ? ' · Gate ' + GATES[t.gate].n : ''}${t.syncPending ? ' · a enviar ao Project' : ''}</span></div></td>
      <td>${PHASES[phaseIdx(t.phase)].name}</td><td class="nowrap">${esc(pname(t.owner))}</td>
      <td class="num nowrap">${fmtS(t.planStart)} – ${fmtS(t.planEnd)}</td><td class="num nowrap">${fmtS(t.baseStart)} – ${fmtS(t.baseEnd)}</td>
      <td class="num ${t.status !== 'concluida' && t.forecast > t.baseEnd ? 'c-yellow' : ''}">${t.status === 'concluida' ? '—' : fmt(t.forecast)}</td>
      <td style="min-width:80px"><span class="num small">${t.pct || 0}%</span>${bar(t.pct || 0, 'amber')}</td>
      <td class="num">${t.doneDate ? fmt(t.doneDate) : '—'}</td>
      <td class="num ${dl ? 'c-red' : ''}">${dl ? '+' + dl + 'd' : '0'}${taskLate(t) ? '<div class="xs c-red">vencida</div>' : ''}</td>
      <td class="small">${dep ? esc(dep.name) : '—'}</td><td>${statusChip(TASK_STATUS, t.status)}</td></tr>`; }).join('')}
    </tbody></table></div>`}`;
}
function renderTimeline(p) {
  const all = p.tasks.flatMap(t => [t.baseStart, t.baseEnd, taskEnd(t)]);
  const min = all.reduce((a, b) => a < b ? a : b), max = all.reduce((a, b) => a > b ? a : b);
  const span = Math.max(1, diff(max, min)), x = d => (diff(d, min) / span * 100).toFixed(2) + '%';
  const ticks = []; let d = min.slice(0, 8) + '01'; if (d < min) d = addDays(d, 32).slice(0, 8) + '01';
  while (d <= max) { ticks.push(d); d = addDays(d, 32).slice(0, 8) + '01'; }
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  return `<div class="tl"><div class="tl-inner">
    <div class="tl-axis"><span></span><div class="ticks">${ticks.map(t => `<span style="left:${x(t)}">${MES[+t.slice(5, 7) - 1]}/${t.slice(2, 4)}</span>`).join('')}</div></div>
    ${p.tasks.map(t => { const e = taskEnd(t), isM = t.baseStart === t.baseEnd; return `<div class="tl-row" role="button" tabindex="0" data-act="open-task" data-id="${t.id}" aria-label="${esc(t.name)}: previsão ${fmt(e)}, linha de base ${fmt(t.baseEnd)}">
      <span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.name)}</span>
      <div class="tl-track"><span class="tl-base" style="left:${x(t.baseStart)};width:calc(${x(t.baseEnd)} - ${x(t.baseStart)} + 3px)"></span>
        <span class="tl-bar ${t.status === 'concluida' ? 'done' : (e > t.baseEnd ? 'late' : '')}" style="left:${x(t.planStart)};width:calc(${x(e)} - ${x(t.planStart)} + 4px)"></span>
        ${t.contractual ? `<span class="tl-mile" style="left:${x(t.contractDate)}" title="Data contratual ${fmt(t.contractDate)}"></span>` : ''}
        ${REF >= min && REF <= max ? `<span class="tl-today" style="left:${x(REF)}"></span>` : ''}</div></div>`; }).join('')}
  </div></div>
  <div class="legend"><span><i style="background:var(--line-2)"></i>Linha de base</span><span><i style="background:var(--blue)"></i>Previsão no prazo</span><span><i style="background:var(--red)"></i>Previsão após a linha de base</span><span><i style="background:var(--green)"></i>Concluída</span><span><i style="background:var(--accent);width:8px;height:8px;transform:rotate(45deg)"></i>Data contratual</span><span><i style="border-left:2px dashed var(--accent);width:2px;height:10px;border-radius:0"></i>Hoje (${fmtS(REF)})</span></div>`;
}

function renderDateBlock(p) {
  const di = dateInfo(p);
  return `<section class="box ${di.changes >= 2 ? 'warnbox' : ''}" style="margin-bottom:12px"><h3>Mudanças da data de término ${p.closed ? '' : `<button class="btn sm" data-act="open-date">${ic('edit', 's')} Alterar data de término</button>`}</h3>
    <div class="datehead"><div><span class="lbl-s">Data original</span><b class="num">${fmt(di.original)}</b><span class="xs muted">preservada, nunca é sobrescrita</span></div>
      <div><span class="lbl-s">Previsão atual</span><b class="num">${fmt(di.forecast)}</b></div>
      <div><span class="lbl-s">Desvio acumulado</span><b>${devTxt(di.dev)}</b></div>
      <div><span class="lbl-s">Mudanças</span><b class="num ${di.changes >= 3 ? 'c-red' : di.changes === 2 ? 'c-amber' : ''}">${di.changes}×</b>${di.changes >= 2 ? `<span class="xs c-red">${ic('alert', 's')} Projeto já mudou de data ${di.changes} vezes</span>` : ''}</div></div>
    ${di.changes ? `<div class="tablewrap"><table class="grid compact" style="min-width:720px"><thead><tr><th>#</th><th>Registrado em</th><th>De</th><th>Para</th><th>Desvio da mudança</th><th>Desvio acumulado</th><th>Categoria</th><th>Motivo</th><th>Por</th></tr></thead><tbody>
      ${p.dateChanges.map((c, i) => `<tr><td class="num">${i + 1}ª</td><td class="num small">${fmtDT(c.at)}</td><td class="num">${fmt(c.from)}</td><td class="num">${fmt(c.to)}</td><td>${devTxt(diff(c.to, c.from))}</td><td>${devTxt(diff(c.to, di.original))}</td><td class="small">${esc(DATE_CAT[c.cat] || '—')}</td><td class="small">${esc(c.reason)}</td><td class="small nowrap">${esc(pname(c.by))}</td></tr>`).join('')}
    </tbody></table></div>` : '<span class="small muted">O término nunca foi alterado. Qualquer mudança exige motivo e fica registrada aqui.</span>'}</section>`;
}

/* Documentação */
function tabDocs(p) {
  const ds = docStats(p), F = U.docFilter;
  const show = d => F === 'todos' ? true : F === 'fase' ? docInScope(p, d) : F === 'vencidos' ? docOverdue(p, d) : docAwaiting(d);
  const st = [['fase', 'Regularidade até a fase atual', `${pct(ds.curDone, ds.curTotal)}%`, `${ds.curDone} de ${ds.curTotal} obrigatórios`, ds.curDone < ds.curTotal ? 'c-yellow' : 'c-green'],
    ['todos', 'Regularidade total', `${pct(ds.allDone, ds.allTotal)}%`, `${ds.allDone} de ${ds.allTotal} · ${ds.na.length} não aplicável(is)`, ''],
    ['vencidos', 'Documentos vencidos', ds.overdue.length, 'obrigatórios até a fase atual', ds.overdue.length ? 'c-red' : 'c-green'],
    ['aguardando', 'Aguardando aprovação', ds.awaiting.length, 'do cliente', ds.awaiting.length ? 'c-amber' : '']];
  const rows = p.docs.filter(show);
  return `<div class="stats">${st.map(([k, l, v, h, c]) => `<button class="stat" data-act="doc-filter" data-id="${k}" aria-pressed="${F === k}"><span class="lbl">${l}</span><span class="val ${c}">${v}</span><span class="xs muted">${h}</span></button>`).join('')}</div>
  <div class="toolbar" style="margin-top:0"><span class="small sub">Filtro: <b>${({ todos: 'todos os documentos', fase: 'exigidos até a fase atual', vencidos: 'vencidos', aguardando: 'aguardando aprovação' })[F]}</b></span>${F !== 'todos' ? '<button class="link small" data-act="doc-filter" data-id="todos">Mostrar todos</button>' : ''}
  <span class="sp"></span><span class="xs muted">Profundidade exigida pela complexidade ${p.complexity}: ${DEPTH[p.complexity]}</span></div>
  <div class="tablewrap"><table class="grid"><thead><tr><th>Documento</th><th>Fase exigida</th><th>Obrigatoriedade</th><th>Responsável</th><th>Prazo</th><th>Situação</th><th>Versão</th><th>Link</th><th>Aprovador</th><th>Evidência da aprovação</th><th>Atualização</th></tr></thead><tbody>
  ${rows.length ? PHASES.map(ph => { const r = rows.filter(d => d.phase === ph.id); if (!r.length) return ''; return `<tr><td colspan="11" style="background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:6px 12px">${ph.name}${phaseIdx(ph.id) > curPI(p) ? ' · fase futura' : ''}</td></tr>` + r.map(d => `<tr class="rowlink" tabindex="0" data-act="open-doc" data-id="${d.id}">
    <td><div class="two"><b>${esc(d.name)}</b><span class="mono muted xs">${d.id}</span></div></td><td>${ph.name}</td>
    <td>${d.status === 'na' ? '<span class="muted">Não aplicável</span>' : d.req === 'obrigatorio' ? 'Obrigatório' : '<span class="sub">Opcional</span>'}</td>
    <td class="nowrap">${esc(pname(d.owner))}</td>
    <td class="nowrap">${d.status === 'na' ? '—' : docOverdue(p, d) ? `<span class="c-red num">${fmt(d.due)}</span><div class="xs c-red">vencido</div>` : d.due ? `<span class="num">${fmt(d.due)}</span>` : (docDone(d) ? '—' : '<span class="muted">sem prazo definido</span>')}</td>

/* ===== Painéis laterais ===== */

}
function renderPanel() {

function renderPhasesList() {

function panelStep(p, n) {

      ${s.evidences.map(e => `<div class="small">${ic('link', 's')} ${esc(e.text)} <span class="muted xs">· ${esc(pname(e.by))}, ${fmtDT(e.at)}</span></div>`).join('')}
    </section>
    <form class="form" data-form="step" data-id="${n}">

      <div class="field"><span>Início planejado</span><input id="st-ps" name="planStart" type="date" class="input" value="${s.planStart}" ${can ? '' : 'disabled'}></div>
      <div class="field"><span>Término planejado</span><input id="st-pe" name="planEnd" type="date" class="input" value="${s.planEnd}" ${can ? '' : 'disabled'}></div>
      <div class="field"><span>Início real</span><input id="st-rs" name="realStart" type="date" class="input" value="${s.realStart || ''}" ${can ? '' : 'disabled'}></div>
      <div class="field"><span>Término real</span><input id="st-re" name="realEnd" type="date" class="input" value="${s.realEnd || ''}" ${can ? '' : 'disabled'}></div>
      <div class="field full"><span>Impedimento</span><textarea id="st-imp" name="impediment" class="input" placeholder="Descreva o que impede a etapa, se houver" ${can ? '' : 'disabled'}>${esc(s.impediment)}</textarea></div>
      <div class="field full"><span>Justificativa de não aplicável</span><textarea id="st-na" name="naReason" class="input" placeholder="Obrigatória quando a situação for Não aplicável" ${can ? '' : 'disabled'}>${esc(s.naReason)}</textarea></div>
      <div class="field full"><span>Nova evidência (opcional)</span><input id="st-ev" name="evidence" class="input" placeholder="Ex.: Ata da reunião arquivada em 02-Handover" ${can ? '' : 'disabled'}></div>
      ${errBox('step')}
      ${can ? `<div class="form-actions">${isCur ? '<span class="xs muted" style="margin-right:auto">Para concluir a etapa atual use “Avançar etapa” no cabeçalho.</span>' : ''}<button class="btn primary" type="submit">Salvar etapa</button></div>` : '<p class="xs muted full">Perfil de cliente: somente leitura.</p>'}
    </form>
    <section class="sec"><h3>Histórico da etapa</h3>${hist.length ? `<ul class="hist">${hist.map(h => `<li><span class="small num muted">${fmtDT(h.at)}</span><div><div class="what small">${esc(h.action)}</div>${h.reason ? `<div class="xs">Motivo: ${esc(h.reason)}</div>` : ''}<div class="xs muted">${esc(pname(h.who))}</div></div></li>`).join('')}</ul>` : '<span class="muted small">Sem eventos registrados.</span>'}</section>`, true);
}

function panelGate(p, gid) {
  const g = GATES[gid], st = p.gates[gid], gs = gateSummary(p, gid), canEdit = S.role !== 'CLI' && st.status !== 'aprovado' && !p.closed;
  const pendingAppr = gatePendingApprovers(p, gid), myKey = S.role, iAmApprover = st.status === 'aguardando' && pendingAppr.some(a => a.key === myKey);
  const ev = g.criteria.filter(c => c.doc).map(c => p.docs.find(d => d.id === c.doc)).filter(Boolean);
  const reqDisabled = !gs.all || S.role === 'CLI';
  let decision = '';
  if (p.closed || st.status === 'aprovado') {
    decision = `<div class="callout green">${ic('check')}<div class="grow"><p class="strong">Gate aprovado</p>${g.approvers.map(a => { const x = st.approvals[a.key]; return x ? `<p class="small">${esc(a.label)}: ${esc(pname(x.by))} em ${fmtDT(x.at)}${x.comment ? ' — “' + esc(x.comment) + '”' : ''}</p>` : ''; }).join('')}</div></div>`;
  } else if (st.status === 'aguardando') {
    decision = `<div class="callout blue">${ic('clock')}<div class="grow"><p>Aprovação solicitada por ${esc(pname(st.requestedBy))} em ${fmtDT(st.requestedAt)}. Pendente: ${pendingAppr.map(a => esc(a.label) + ' (' + esc(pname(approverPerson(p, a.key))) + ')').join(', ')}.</p></div></div>
      ${!gs.all ? `<div class="callout red">${ic('alert')}<p>Um critério deixou de ser atendido após a solicitação. A decisão fica bloqueada até que ele seja resolvido.</p></div>` : ''}
      ${iAmApprover ? `<form class="form" data-form="gate-decision" data-id="${gid}">
        <fieldset class="full" style="border:0;padding:0;margin:0;display:flex;gap:14px;flex-wrap:wrap"><legend class="lbl-s" style="margin-bottom:6px">Decisão como ${esc(pendingAppr.find(a => a.key === myKey).label)} · ${esc(pname(approverPerson(p, myKey)))}</legend>
          <label class="check"><input type="radio" name="decision" value="aprovado" id="gd-a" checked> Aprovar</label>
          <label class="check"><input type="radio" name="decision" value="devolvido" id="gd-d"> Devolver para ajustes</label></fieldset>
        <div class="field full"><span>Comentário da decisão</span><textarea id="gd-c" name="comment" class="input" placeholder="Obrigatório ao devolver para ajustes"></textarea></div>
        ${errBox('gate-decision')}
        <div class="form-actions"><button class="btn primary" type="submit" ${gs.all ? '' : 'disabled'}>Registrar decisão</button></div></form>`
      : `<p class="small sub">Seu perfil de demonstração (${roleName()}) não é um aprovador pendente. Troque o perfil no topo da página para registrar ${pendingAppr.map(a => esc(a.label)).join(' e ')}.</p>`}`;
  } else {
    const back = Object.entries(st.approvals).find(([, a]) => a && a.decision === 'devolvido');
    decision = `${back ? `<div class="callout red">${ic('alert')}<div class="grow"><p class="strong">Devolvido para ajustes por ${esc(pname(back[1].by))} em ${fmtDT(back[1].at)}</p><p class="small">“${esc(back[1].comment)}”</p></div></div>` : ''}
      ${gs.all ? `<div class="callout green">${ic('check')}<p>Todos os critérios estão atendidos. O gate ainda <b>não está aprovado</b>: solicite a aprovação de ${g.approvers.map(a => esc(a.label)).join(' e ')}.</p></div>`
      : `<div class="callout yellow">${ic('lock')}<div class="grow"><p class="strong">Solicitação bloqueada: ${gs.blockers.length} critério(s) não atendido(s)</p><ul class="small" style="margin:4px 0 0;padding-left:18px">${gs.blockers.map(b => `<li>${esc(b.text)}${b.d ? ` — <button class="link" data-act="open-doc" data-id="${b.d.id}">abrir ${esc(b.d.name)}</button>` : ''}</li>`).join('')}</ul></div></div>`}
      ${S.role === 'CLI' ? '<p class="small sub">A solicitação de aprovação é feita pelo GP ou pela Liderança.</p>' : `<div><button class="btn primary" data-act="gate-request" data-id="${gid}" ${reqDisabled ? 'disabled aria-describedby="req-why"' : ''}>${ic('arrow', 's')} ${back ? 'Reenviar para aprovação' : 'Solicitar aprovação'}</button>${reqDisabled ? '<span id="req-why" class="xs muted" style="margin-left:8px">Disponível quando todos os critérios forem atendidos.</span>' : ''}</div>`}`;
  }
  return drawer(`Gate ${g.n} · ${PHASES[phaseIdx(g.phase)].name} · ${p.id}/${gid}`, `${g.name}`, `
    <div class="split">
      <div class="box"><span class="lbl-s">Critérios atendidos</span><span class="big num">${gs.met} de ${gs.total}</span>${bar(pct(gs.met, gs.total), gs.all ? '' : 'yellow')}</div>
      <div class="box"><span class="lbl-s">Aprovação do gate</span><span>${statusChip(GATE_STATUS, st.status)}</span><span class="xs muted">Marcar todos os critérios não aprova o gate.</span></div>
    </div>
    <section class="sec"><h3>Objetivo</h3><p style="margin:0">${esc(g.objective)}</p><span class="small muted">Previsto para ${fmt(gateDue(p, gid))}</span></section>
    <section class="sec"><h3>Aprovadores</h3>${g.approvers.map(a => { const x = st.approvals[a.key]; const ps = approverPerson(p, a.key); return `<div class="appr">${av(ps)}<div class="grow"><b>${esc(a.label)}</b><div class="small sub">${esc(pname(ps))}${isClient(ps) ? ' · cliente' : ''}</div>${x ? `<div class="xs muted">${x.decision === 'aprovado' ? 'Aprovou' : 'Devolveu'} em ${fmtDT(x.at)}${x.comment ? ' — “' + esc(x.comment) + '”' : ''}</div>` : ''}</div>${x ? chip(x.decision === 'aprovado' ? 'green' : 'red', x.decision === 'aprovado' ? 'Aprovado' : 'Devolvido') : chip('gray', st.status === 'aguardando' ? 'Pendente' : 'Aguardando solicitação')}</div>`; }).join('')}
      ${g.approvers.length > 1 ? '<span class="xs muted">Aprovação interna e do cliente são registradas separadamente; o gate só é aprovado com as duas.</span>' : ''}</section>
    <section class="sec"><h3>Solicitação e decisão</h3>${decision}</section>
    <section class="sec"><h3>Checklist <span class="muted xs">${canEdit ? 'Critérios manuais podem ser marcados pelo GP ou Liderança' : 'Somente leitura'}</span></h3>
      ${gs.crit.map(c => `<div class="crit ${c.met ? '' : 'unmet'}">
        ${c.source === 'manual' ? `<input type="checkbox" id="gc-${c.id}" data-change="gate-crit" data-gate="${gid}" data-c="${c.id}" ${c.met ? 'checked' : ''} ${canEdit ? '' : 'disabled'} aria-describedby="gcn-${c.id}">` : `<span class="ck ${c.met ? 'ok' : 'no'}" aria-hidden="true">${c.met ? ic('check', 's') : ''}</span>`}
        <div class="grow"><label for="gc-${c.id}" class="${c.met ? '' : 'strong'}">${esc(c.text)}</label>
          <div class="xs ${c.reval ? 'c-yellow' : 'muted'}" id="gcn-${c.id}">${c.source === 'doc' ? 'Vinculado ao documento · ' : c.source === 'auto' ? 'Calculado · ' : ''}${esc(c.note || (c.met ? '' : 'Não atendido'))}</div></div>
        ${c.d ? `<button class="btn sm" data-act="open-doc" data-id="${c.d.id}">Abrir documento</button>` : ''}${!c.met ? chip('red', 'Bloqueador') : ''}</div>`).join('')}
    </section>
    <section class="sec"><h3>Evidências</h3>
      ${ev.map(d => `<div class="small">${ic('doc', 's')} <button class="link" data-act="open-doc" data-id="${d.id}">${esc(d.name)} v${d.version}</button> ${d.approval ? `<span class="muted">· aprovação v${d.approval.version}: ${esc(d.approval.evidence)}</span>` : '<span class="muted">· sem aprovação registrada</span>'}</div>`).join('')}
      ${st.evidences.map(e => `<div class="small">${ic('link', 's')} ${esc(e.text)} <span class="muted xs">· ${esc(pname(e.by))}, ${fmtDT(e.at)}</span></div>`).join('')}
      ${S.role !== 'CLI' ? `<form class="form" data-form="gate-evidence" data-id="${gid}" style="grid-template-columns:1fr auto;align-items:end"><div class="field"><span>Adicionar evidência</span><input id="ge-t" name="text" class="input" placeholder="Ex.: Ata de revisão com o cliente (SharePoint › 03-Discovery)" required></div><button class="btn" type="submit">Adicionar</button></form>` : ''}
    </section>
    <section class="sec"><h3>Histórico do gate</h3>${st.history.length ? `<ul class="hist">${st.history.slice().reverse().map(h => `<li><span class="small num muted">${fmtDT(h.at)}</span><div><div class="small">${esc(h.text)}</div><div class="xs muted">${esc(pname(h.who))}</div></div></li>`).join('')}</ul>` : '<span class="muted small">Sem eventos.</span>'}</section>`, true);
}

function panelDoc(p, id) {
  const d = p.docs.find(x => x.id === id), can = S.role !== 'CLI' && !p.closed;
  const crits = Object.entries(GATES).flatMap(([gid, g]) => g.criteria.filter(c => c.doc === id).map(c => ({ gid, g, c, met: gateCrit(p, gid).find(x => x.id === c.id).met })));
  const future = !docInScope(p, d);
  const canApprove = d.needsApproval && d.status !== 'na' && !docDone(d) && d.versions.length && !p.closed;
  const nextV = d.version === '—' ? '0.1' : (() => { const [a, b] = d.version.split('.').map(Number); return a + '.' + (b + 1); })();
  return drawer(`${d.id} · ${PHASES[phaseIdx(d.phase)].name} · ${p.id}`, esc(d.name), `
    <div style="display:flex;gap:8px;flex-wrap:wrap">${docChip(d)}${chip('outline', d.status === 'na' ? 'Não aplicável' : d.req === 'obrigatorio' ? 'Obrigatório' : 'Opcional')}${chip('outline', 'Profundidade ' + d.depth.toLowerCase())}${d.version !== '—' ? chip('outline', 'v' + d.version) : ''}</div>
    ${docOverdue(p, d) ? `<div class="callout red">${ic('alert')}<p>Vencido desde ${fmt(d.due)}. Responsável pela próxima ação: <b>${esc(pname(docAwaiting(d) ? d.approver : d.owner))}</b>.</p></div>` : ''}
    ${docRevalidate(d) ? `<div class="callout yellow">${ic('alert')}<p>A aprovação registrada vale para a <b>v${d.approval.version}</b>. A versão atual é <b>v${d.version}</b>: os critérios vinculados precisam ser revalidados.</p></div>` : ''}
    ${future && d.status !== 'na' ? `<div class="callout blue">${ic('info')}<p>Exigido na fase ${PHASES[phaseIdx(d.phase)].name}. Por ser de fase futura, não conta como pendência vencida.</p></div>` : ''}
    ${d.status === 'na' ? `<div class="callout">${ic('info')}<p>Não aplicável: ${esc(d.naReason)} Excluído do denominador da regularidade.</p></div>` : ''}
    <dl class="kv"><dt>Fase exigida</dt><dd>${PHASES[phaseIdx(d.phase)].name}</dd><dt>Responsável</dt><dd>${esc(pname(d.owner))}</dd><dt>Prazo</dt><dd>${dueTxt(d.due)}</dd>
      <dt>Versão atual</dt><dd class="num">${d.version}</dd><dt>Link</dt><dd class="mono" style="word-break:break-all">${d.path ? esc(d.path) : '<span class="muted">Sem arquivo</span>'}</dd>
      <dt>Aprovador</dt><dd>${d.needsApproval ? esc(pname(d.approver)) + ' <span class="muted small">(' + esc(d.apprNote.toLowerCase()) + ')</span>' : '<span class="muted">Não exige aprovação</span>'}</dd>
      <dt>Evidência da aprovação</dt><dd>${d.approval ? `v${d.approval.version} · ${esc(pname(d.approval.by))} em ${fmtDT(d.approval.at)}<br><span class="small sub">${esc(d.approval.evidence)}</span><br><span class="xs muted">Registrado por ${esc(pname(d.approval.registeredBy))}</span>` : '—'}</dd>
      <dt>Última atualização</dt><dd>${fmtDT(d.updatedAt)}</dd></dl>
    ${crits.length ? `<section class="sec"><h3>Critérios de gate vinculados</h3>${crits.map(x => `<button class="crit ${x.met ? '' : 'unmet'}" style="width:100%;text-align:left;cursor:pointer" data-act="open-gate" data-id="${x.gid}"><span class="ck ${x.met ? 'ok' : 'no'}" aria-hidden="true">${x.met ? ic('check', 's') : ''}</span><span class="grow">Gate ${x.g.n} · ${esc(x.c.text)}<br><span class="xs muted">${x.met ? 'Atendido' : 'Não atendido'} · gate ${GATE_STATUS[p.gates[x.gid].status].label.toLowerCase()}</span></span>${ic('chev', 's')}</button>`).join('')}</section>` : ''}
    ${canApprove ? `<section class="sec"><h3>Registrar aprovação</h3>
      <form class="form" data-form="doc-approve" data-id="${id}">
        <div class="field"><span>Versão aprovada</span><select id="da-v" name="version" class="select">${optList(d.versions.slice().reverse().map(v => [v.v, 'v' + v.v + (v.v === d.version ? ' (atual)' : '') + ' · ' + fmtS(v.at)]), d.version)}</select></div>
        <div class="field"><span>Aprovador</span><select id="da-by" name="by" class="select">${peopleOpts(d.approver)}</select></div>
        <div class="field"><span>Data da aprovação</span><input id="da-at" name="at" type="date" class="input" value="${REF}" max="${REF}"></div>
        <div class="field"><span>Evidência</span><input id="da-ev" name="evidence" class="input" placeholder="Ex.: E-mail de aprovação de 23/10" required></div>
        ${errBox('doc-approve')}
        <div class="form-actions"><span class="xs muted" style="margin-right:auto">A aprovação fica vinculada à versão escolhida.</span><button class="btn primary" type="submit">${ic('check', 's')} Registrar aprovação</button></div>
      </form></section>` : ''}
    ${can && d.status !== 'na' ? `<section class="sec"><h3>Publicar nova versão</h3><form class="form" data-form="doc-version" data-id="${id}" style="grid-template-columns:1fr auto;align-items:end"><div class="field"><span>O que mudou na v${nextV}</span><input id="dv-n" name="note" class="input" required placeholder="Resumo da alteração"></div><button class="btn" type="submit">Publicar v${nextV}</button>
      ${docDone(d) && d.needsApproval ? '<span class="xs c-yellow full">A aprovação atual (v' + d.version + ') não valerá para a nova versão.</span>' : ''}</form></section>` : ''}
    ${can ? `<section class="sec"><h3>Editar dados</h3><form class="form" data-form="doc-edit" data-id="${id}">
      <div class="field"><span>Situação</span><select id="de-s" name="status" class="select">${optList(Object.entries(DOC_STATUS).map(([k, v]) => [k, v.label]), d.status)}</select></div>
      <div class="field"><span>Obrigatoriedade</span><select id="de-r" name="req" class="select">${optList([['obrigatorio', 'Obrigatório'], ['opcional', 'Opcional']], d.req)}</select></div>
      <div class="field"><span>Responsável</span><select id="de-o" name="owner" class="select">${peopleOpts(d.owner, k => !PEOPLE[k].client)}</select></div>
      <div class="field"><span>Prazo</span><input id="de-d" name="due" type="date" class="input" value="${d.due || ''}"></div>
      ${d.needsApproval ? `<div class="field full"><span>Aprovador</span><select id="de-a" name="approver" class="select">${peopleOpts(d.approver)}</select></div>` : ''}
      <div class="field full"><span>Justificativa (obrigatória para Não aplicável)</span><textarea id="de-na" name="naReason" class="input">${esc(d.naReason)}</textarea></div>
      ${errBox('doc-edit')}<div class="form-actions"><button class="btn primary" type="submit">Salvar dados</button></div></form></section>` : ''}
    <section class="sec"><h3>Evidências vinculadas</h3>${d.evidences.map(e => `<div class="small">${ic('link', 's')} ${esc(e.text)} <span class="muted xs">· ${esc(pname(e.by))}, ${fmtDT(e.at)}</span></div>`).join('') || '<span class="muted small">Nenhuma.</span>'}
      ${S.role !== 'CLI' && !p.closed ? `<form class="form" data-form="doc-evidence" data-id="${id}" style="grid-template-columns:1fr auto;align-items:end"><div class="field"><span>Vincular evidência</span><input id="dev-t" name="text" class="input" required placeholder="Ex.: Ata de revisão de 22/10"></div><button class="btn" type="submit">Vincular</button></form>` : ''}</section>
    <section class="sec"><h3>Versões</h3>${d.versions.length ? `<ul class="hist">${d.versions.slice().reverse().map(v => `<li><span class="small num">v${v.v}<div class="xs muted">${fmtDT(v.at)}</div></span><div class="small">${esc(v.note)} <span class="muted">· ${esc(pname(v.by))}</span>${d.approval && d.approval.version === v.v ? ' ' + chip('green', 'aprovada') : ''}</div></li>`).join('')}</ul>` : '<span class="muted small">Nenhuma versão publicada.</span>'}</section>`, true);
}

function panelTask(p, id) {

    <dl class="kv"><dt>Fase</dt><dd>${PHASES[phaseIdx(t.phase)].name} · etapa ${t.step}</dd><dt>Responsável</dt><dd>${esc(pname(t.owner))}</dd>
      <dt>Planejado</dt><dd class="num">${fmt(t.planStart)} – ${fmt(t.planEnd)}</dd><dt>Linha de base</dt><dd class="num">${fmt(t.baseStart)} – ${fmt(t.baseEnd)}</dd>
      <dt>Previsão atual</dt><dd class="num ${!done && t.forecast > t.baseEnd ? 'c-yellow' : ''}">${done ? '—' : fmt(t.forecast)}</dd><dt>Conclusão</dt><dd class="num">${t.doneDate ? fmt(t.doneDate) : '—'}</dd>
      <dt>Atraso</dt><dd class="num ${taskDelay(t) ? 'c-red' : ''}">${taskDelay(t)} dia(s) sobre a linha de base</dd>${t.contractual ? `<dt>Data contratual</dt><dd class="num">${fmt(t.contractDate)}</dd>` : ''}
      <dt>Dependência</dt><dd>${dep ? `<button class="link" data-act="open-task" data-id="${dep.id}">${esc(dep.name)}</button> (${TASK_STATUS[dep.status].label.toLowerCase()})` : '—'}</dd></dl>
    ${can && !done ? `<section class="sec"><h3>Alterar previsão</h3><form class="form" data-form="task-forecast" data-id="${id}">
      <div class="field"><span>Nova previsão</span><input id="tf-d" name="date" type="date" class="input" value="${t.forecast}" required></div>

let opener = null;
const cur = () => U.pid ? getP(U.pid) : null;
function openPanel(type, id, extra) { if (!U.panel) opener = document.activeElement; U.err = null; U.panel = { type, pid: U.pid, id, ...(extra || {}) }; save(); render(); const t = document.getElementById('panel-title'); if (t) t.focus(); }
function closePanel() { U.panel = null; U.err = null; render(); if (opener && document.body.contains(opener)) opener.focus(); else { const h = document.querySelector('[data-act="back"]') || document.querySelector('.subtabs [aria-selected="true"]'); h && h.focus(); } opener = null; }
function keepPanel() { if (U.panel) U.panel.keep = true; }
function fail(form, msg) { U.err = { form, msg }; keepPanel(); render(); const e = document.querySelector('[role="alert"]'); e && e.scrollIntoView({ block: 'nearest' }); }
function bumpVersion(v) { if (v === '—') return '0.1'; const [a, b] = v.split('.').map(Number); return a + '.' + (b + 1); }
function docPath(p, d, v) {
  if (d.path) return d.path.replace(/_v[\d.]+\.docx$/, '_v' + v + '.docx');
  const t = DOC_TPL.find(x => x.id === d.id), dpi = phaseIdx(d.phase);
  return p.pathTpl.base + ' › ' + String(dpi).padStart(2, '0') + '-' + PHASES[dpi].name + ' › ' + t.file + '_v' + v + '.docx';
}

function syncProject(p) {
  let inc = 0;
  p.pendingSync.forEach(ch => { const t = p.tasks.find(x => x.key === ch.task); if (t) { Object.assign(t, ch.set); if (t.status === 'concluida') t.pct = 100; inc++; log(p, { kind: 'cronograma', who: p.gp, action: 'Recebido do Project: ' + t.name, detail: ch.note }); } });
  p.pendingSync = [];
  const out = p.tasks.filter(t => t.syncPending); out.forEach(t => t.syncPending = false);
  p.lastSync = nowStamp();
  log(p, { kind: 'sync', action: 'Sincronização simulada com o Project', detail: `${inc} alteração(ões) recebida(s), ${out.length} enviada(s)` });
  return inc + out.length;
}

function advance(p) {
  const chk = advanceCheck(p);
  if (!chk.ok) { openPanel('blocked'); return; }
  commit(p, () => {
    const n = p.step, s = p.steps[n], fromPI = stepPI(n);
    if (s.status !== 'na') { s.status = 'concluida'; s.realEnd = REF; s.realStart = s.realStart || REF; }
    p.tasks.filter(t => t.step === n && t.status !== 'concluida').forEach(t => { t.status = 'concluida'; t.doneDate = REF; t.pct = 100; t.syncPending = true; });
    log(p, { kind: 'etapa', action: `Etapa ${n} concluída: ${STEPS[n].name}`, step: n });
    if (n === 15) { p.goLive = REF; p.situation = 'garantia'; log(p, { kind: 'etapa', action: 'Go-live realizado: garantia iniciada', detail: 'Garantia de 30 dias até ' + fmt(addDays(REF, 30)) }); }
    if (n === 18) { p.closed = true; p.situation = 'encerrado'; log(p, { kind: 'etapa', action: 'Projeto encerrado formalmente', detail: 'Etapa 18 concluída' }); return; }
    let m = n + 1; while (m < 18 && p.steps[m].status === 'na') m++;
    p.step = m; const ns = p.steps[m];
    if (ns.status === 'nao_iniciada') { ns.status = 'em_andamento'; ns.realStart = REF; }
    p.tasks.filter(t => t.step === m && t.status === 'nao_iniciada').forEach(t => { t.status = 'em_andamento'; t.pct = Math.max(t.pct || 0, 5); });
    log(p, { kind: 'etapa', action: `Etapa ${m} iniciada: ${STEPS[m].name}`, step: m });
    if (stepPI(m) !== fromPI) {
      log(p, { kind: 'etapa', action: `Mudança de fase: ${PHASES[fromPI].name} → ${PHASES[stepPI(m)].name}` });
      const g = PHASES[stepPI(m)].gate; if (g && p.gates[g].status === 'nao_iniciado') p.gates[g].status = 'em_preparacao';
      p.docs.filter(d => d.phase === PHASES[stepPI(m)].id && d.status === 'pendente').forEach(d => d.status = 'elaboracao');
      U.open[p.id] = [PHASES[stepPI(m)].id];
    }
  });
  toast(p.closed ? 'Projeto encerrado.' : `Avançou para a etapa ${p.step}: ${STEPS[p.step].name}`);
}

function gateDecide(p, gid, decision, comment) {
  const st = p.gates[gid], key = S.role, person = approverPerson(p, key), g = GATES[gid];
  if (decision === 'devolvido' && !comment.trim()) return fail('gate-decision', 'Informe a justificativa para devolver o gate para ajustes.');
  if (decision === 'aprovado' && !gateSummary(p, gid).all) return fail('gate-decision', 'Há critérios não atendidos. Resolva-os antes de aprovar.');
  keepPanel();
  commit(p, () => {
    st.approvals[key] = { decision, by: person, at: nowStamp(), comment: comment.trim() };
    const lbl = g.approvers.find(a => a.key === key).label;
    if (decision === 'devolvido') {
      st.status = 'devolvido';
      Object.keys(st.approvals).forEach(k => { if (k !== key) delete st.approvals[k]; });
      st.history.push({ at: nowStamp(), who: person, text: `Devolvido para ajustes (${lbl}): ${comment.trim()}` });
      log(p, { kind: 'gate', who: person, action: `Gate ${g.n} devolvido para ajustes`, detail: lbl, reason: comment.trim(), gate: gid });
    } else {
      st.history.push({ at: nowStamp(), who: person, text: `Aprovado (${lbl})${comment.trim() ? ': ' + comment.trim() : ''}` });
      log(p, { kind: 'gate', who: person, action: `Aprovação registrada no Gate ${g.n}: ${lbl}`, detail: comment.trim(), gate: gid });
      if (!gatePendingApprovers(p, gid).length) {
        st.status = 'aprovado';
        st.history.push({ at: nowStamp(), who: person, text: 'Gate aprovado: todas as aprovações exigidas registradas' });
        log(p, { kind: 'gate', who: person, action: `Gate ${g.n} aprovado — ${g.name}`, detail: g.approvers.map(a => a.label + ': ' + pname(st.approvals[a.key].by)).join(' · '), gate: gid });
        p.tasks.filter(t => t.gate === gid && t.status !== 'concluida').forEach(t => { t.status = 'concluida'; t.doneDate = REF; t.pct = 100; t.syncPending = true; log(p, { kind: 'cronograma', who: person, action: 'Entrega concluída: ' + t.name, detail: 'Será enviada ao Project na próxima sincronização' }); });
        if (gid === 'G3') p.docs.filter(d => !d.due && d.status !== 'na').forEach(d => { const ph = PHASES[phaseIdx(d.phase)]; d.due = d.phase === 'garantia' ? addDays(p.steps[17].planEnd, -2) : p.steps[ph.steps.slice(-1)[0]].planEnd; });
      }
    }
  });
  toast(st.status === 'aprovado' ? `Gate ${g.n} aprovado. Use “Avançar etapa” para seguir.` : decision === 'devolvido' ? `Gate ${g.n} devolvido para ajustes.` : 'Aprovação registrada. Aguardando os demais aprovadores.');
}

function recordDateChange(p, before, cat, reason) {
  const after = projForecastEnd(p); if (after === before) return null;
  p.dateChanges.push({ at: nowStamp(), by: actor(p), from: before, to: after, reason, cat });
  const n = p.dateChanges.length, dev = diff(after, p.originalEnd);
  log(p, { kind: 'cronograma', action: `Data de término alterada (${diff(after, before) > 0 ? '+' : ''}${diff(after, before)} dias): ${fmt(before)} → ${fmt(after)}`, detail: `Mudança ${n} · desvio acumulado ${dev > 0 ? '+' : ''}${dev} dias sobre a data original (${fmt(p.originalEnd)})`, reason });
  return n;
}
